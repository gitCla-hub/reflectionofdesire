<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi chữ (Ngrok Online)</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #1a1a1a; 
            color: #ffffff; 
        }
        .container { 
            background: #2a2a2a; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            text-align: center;
            width: 85%;
            max-width: 400px;
        }
        h2 { margin-top: 0; font-size: 22px; color: #f3f3f3; }
        input { 
            padding: 12px; width: 100%; font-size: 16px; border: 2px solid #444; 
            border-radius: 6px; background-color: #111; color: white;
            box-sizing: border-box; margin-bottom: 15px;
        }
        button { 
            padding: 12px; width: 100%; font-size: 16px; background-color: #4CAF50; 
            color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        button:hover { background-color: #45a049; }
        #status { margin-top: 15px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>Nhập chữ muốn gửi</h2>
    <input type="text" id="userInput" placeholder="Nhập nội dung tại đây..." autocomplete="off">
    <button onclick="sendToTouchDesigner()">Gửi dữ liệu công khai</button>
    <div id="status"></div>
</div>

<script>
    async function sendToTouchDesigner() {
        const textValue = document.getElementById('userInput').value;
        const statusDiv = document.getElementById('status');
        
        if (!textValue.trim()) {
            statusDiv.innerText = "⚠️ Vui lòng nhập chữ trước khi gửi!";
            statusDiv.style.color = "#ffb3b3";
            return;
        }

        statusDiv.innerText = "⏳ Đang gửi dữ liệu ra Internet...";
        statusDiv.style.color = "#aaa";

        try {
            // Sử dụng link Ngrok cố định từ bảng Terminal của bạn
            const ngrokLink = "https://retrain-uncouth-cartwheel.ngrok-free.dev"; 

            const response = await fetch(ngrokLink, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: textValue })
            });

            if (response.ok) {
                statusDiv.innerText = "✅ Tuyệt vời! Chữ đã bay vào TouchDesigner.";
                statusDiv.style.color = "#4CAF50";
                document.getElementById('userInput').value = ''; 
            } else {
                statusDiv.innerText = "❌ Lỗi: Server phản hồi thất bại.";
                statusDiv.style.color = "#f44336";
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "🚫 Lỗi kết nối! Hãy chắc chắn cửa sổ Terminal Ngrok trên Mac vẫn mở và node webserver1 trong TD đã ấn Restart.";
            statusDiv.style.color = "#f44336";
        }
    }
</script>

</body>
</html>
